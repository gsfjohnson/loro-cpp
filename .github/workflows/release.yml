name: release

on:
  release:
    types: [published]
  workflow_dispatch:
#  push:
#    branches: [main]
#    tags: ['v*']
#  pull_request:
#    branches: [main]

# Release builds across the three supported toolchains. Each job:
#   1. Configures + builds + runs tests with BUILD_TESTING=ON.
#   2. Installs to a job-local prefix.
#   3. Builds the FetchContent consumer in `find` mode against the install
#      tree, confirming loroConfig + loroTargets resolve correctly.
#   4. Builds the same consumer in `fetch` mode against the source checkout,
#      confirming a downstream FetchContent integration works end-to-end.
#   5. Uploads the install tree as a release artifact.

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 ships gcc-13/libstdc++-13, which handles the
          # recursive `unordered_map<string, LoroValue>` in the generated
          # bindings. ubuntu-22.04 (gcc-11/libstdc++-11) rejects incomplete
          # value types — N4510 support landed in libstdc++-12. Pinned (rather
          # than `ubuntu-latest`) so the uploaded artifact name is stable.
          - os: ubuntu-24.04
            shell: bash
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            shell: bash
            rust_target: aarch64-apple-darwin
          - os: windows-latest
            shell: 'msys2 {0}'
            rust_target: x86_64-pc-windows-gnullvm

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      # ----- Linux: clang + ninja + rustup ---------------------------------
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build cmake
          clang --version
          ninja --version
          cmake --version

      # ----- macOS: clang ships with Xcode; install ninja ------------------
      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install ninja
          clang --version
          ninja --version
          cmake --version

      # ----- Windows: MSYS2 CLANG64 (matches local dev environment) -------
      # path-type: inherit appends Windows PATH after the MSYS2 paths so the
      # MSYS2 shell can see rustup's `~/.cargo/bin` (added to Windows PATH via
      # $GITHUB_PATH in the "Expose rustup" step below). With the default
      # `minimal`, $GITHUB_PATH additions are invisible inside MSYS2 and
      # corrosion's FindRust fails to locate rustc.
      #
      # cmake/ninja are pulled from the MSYS2 *base* repo (msys/cmake,
      # msys/ninja) rather than the CLANG64 mingw-prefixed packages — those
      # are Windows-native binaries that report `CMAKE_HOST_SYSTEM_NAME ==
      # "Windows"`, which (a) bypasses the `if(CMAKE_HOST_SYSTEM_NAME STREQUAL
      # "MSYS")` block in our top-level CMakeLists that pins
      # Rust_CARGO_TARGET=…-gnullvm, so corrosion silently falls back to the
      # rustup-default `x86_64-pc-windows-msvc`, and (b) cannot consume the
      # MSYS-form working-directory paths that vendor/corrosion's local patch
      # produces (cmd.exe gets `cd /D /d/a/…` and bails). The base-repo cmake
      # is the same MSYS-shell cmake the local dev verification was built
      # against — keep CI on it so both stay in lockstep.
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: >-
            git
            cmake
            ninja
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf

      - name: Cache cargo + uniffi-bindgen-cpp builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            loro-cpp-rs/target
            build/uniffi-bindgen-cpp
          key: cargo-${{ matrix.os }}-${{ hashFiles('loro-cpp-rs/Cargo.lock', 'vendor/uniffi-bindgen-cpp/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.os }}-

      # On MSYS2 the rustup toolchain pre-installed on the runner isn't on the
      # MSYS PATH by default — surface it. Use `cygpath -u` to convert the
      # Windows-style $USERPROFILE (`C:\Users\…`) to MSYS form (`/c/Users/…`);
      # embedding the raw Windows path breaks `$PATH` because the drive-letter
      # colon is treated as a PATH separator.
      - name: Expose rustup to MSYS2 (Windows)
        if: runner.os == 'Windows'
        run: |
          CARGO_BIN="$(cygpath -u "$USERPROFILE")/.cargo/bin"
          echo "PATH=$CARGO_BIN:$PATH"
          echo "$CARGO_BIN" >> "$GITHUB_PATH"
          export PATH="$CARGO_BIN:$PATH"
          rustc --version
          cargo --version

      # On Windows, $GITHUB_WORKSPACE is a Windows-form path
      # (`D:\a\loro-cpp\loro-cpp`), but our Windows job uses MSYS2-base cmake
      # (see "Setup MSYS2" comment block above for why). MSYS2-base cmake does
      # not recognize `D:/...` as absolute and treats such prefixes as
      # relative, double-nesting install destinations and breaking
      # find_package on the install tree. Convert via `cygpath -u` so cmake
      # sees `/d/a/...`. Linux/macOS pass through unchanged.
      - name: Compute workspace paths
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            WS="$(cygpath -u "${GITHUB_WORKSPACE}")"
          else
            WS="${GITHUB_WORKSPACE}"
          fi
          echo "INSTALL_PREFIX=${WS}/install" >> "${GITHUB_ENV}"
          echo "LORO_SOURCE_DIR=${WS}" >> "${GITHUB_ENV}"

      # Linux/macOS hosts already match their matrix target so this is a no-op
      # there; on Windows it installs the gnullvm target that the CMake config
      # pins via Rust_CARGO_TARGET.
      - name: Install Rust target
        run: rustup target add ${{ matrix.rust_target }}

      # ----- Configure + build + test --------------------------------------
      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLORO_BUILD_EXAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_PREFIX }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

      # ----- Install + verify the package via find_package -----------------
      - name: Install
        run: cmake --install build

      - name: Consumer (find_package)
        run: |
          cmake -S examples/consumer-fetchcontent -B build/consumer-find -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLORO_CONSUMER_MODE=find \
            -DCMAKE_PREFIX_PATH="${{ env.INSTALL_PREFIX }}"
          cmake --build build/consumer-find --parallel
          ctest --test-dir build/consumer-find --output-on-failure

      # ----- Verify FetchContent path against the source checkout ---------
      - name: Consumer (FetchContent)
        run: |
          cmake -S examples/consumer-fetchcontent -B build/consumer-fetch -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLORO_CONSUMER_MODE=fetch \
            -DLORO_CONSUMER_SOURCE_DIR="${{ env.LORO_SOURCE_DIR }}"
          cmake --build build/consumer-fetch --parallel
          ctest --test-dir build/consumer-fetch --output-on-failure

      # ----- Build a release artifact via CPack ---------------------------
      # CPack staging is independent of the `cmake --install` step above —
      # the install tree is kept around for the find_package consumer test;
      # CPack creates its own staging dir and produces a .deb (Linux) or
      # .zip (macOS/Windows) at the build root.
      - name: Package install tree
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: build
        run: cpack --verbose

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: loro-cpp-${{ matrix.os }}
          path: |
            build/loro-cpp*.deb
            build/loro-cpp*.zip
          if-no-files-found: error
